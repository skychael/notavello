                || url.hostname !== "www.youtube.com"
                || url.pathname !== "/watch"
                || !/^[A-Za-z0-9_-]{11}$/.test(url.searchParams.get("v") || "")
              ) {
                throw new Error(`Invalid YouTube URL for video ${item.video_id || "unknown"}`);
              }
            }
            console.log(`Valid Relay video data: ${data.items.length} items`);
          '

      - name: Check whitespace
        run: git diff --check

      - name: Commit and push updated data
        run: |
          if git diff --quiet -- pages/relay/video-data.json; then
            echo "Relay video data is unchanged."
            exit 0
          fi

          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^pages/relay/video-data.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pages/relay/video-data.json
          git commit -m "Update Relay video data"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
