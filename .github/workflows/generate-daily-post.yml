name: Generate Daily Blog Post

on:
  schedule:
    # 01:30 UTC daily = 6:30 PM Pacific Daylight Time (roughly Mar-Nov)
    # = 5:30 PM Pacific Standard Time the rest of the year, since GitHub's
    # cron is fixed UTC and does not shift for daylight saving.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Blog topic (blank uses the Iran/energy/food-supply editorial brief)"
        required: false
        type: string
      source_context:
        description: "Optional one-time source/context for this post only"
        required: false
        type: string
      dry_run:
        description: "Dry run only"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: notavello-main-writes
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save --package-lock=false openai

      - name: Generate today's post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_TOPIC: ${{ github.event.inputs.topic || '' }}
          SOURCE_CONTEXT: ${{ github.event.inputs.source_context || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          # A manually entered topic or one-time source/context still overrides
          # the automatic editorial brief.
          #
          # Blank scheduled/manual runs use ChatGPT's own web search to find
          # the strongest current, verified angle. Relay and Hacker News are
          # not used as sources or topic selectors.
          if [ -z "$BLOG_TOPIC" ] && [ -z "$SOURCE_CONTEXT" ]; then
            export BLOG_TOPIC="Choose one strong, current, non-duplicate article angle from this editorial field: the Iran war and regional escalation; Strait of Hormuz, Persian Gulf, Red Sea or Suez shipping risk; tanker, port, refinery, pipeline, LNG or oil-production disruptions; Brent and WTI price moves; U.S. Strategic Petroleum Reserve and commercial petroleum inventory levels; sanctions, OPEC or government emergency responses; natural-gas, ammonia, urea and fertilizer scarcity; crop-input, food-price and inflation consequences. Use web search to discover what is genuinely important now. Prefer a concrete development with a measurable consequence for ordinary people, industry, agriculture, shipping or markets. Do not write a generic war recap, routine military-hardware story, speculative prediction, or claim a shortage or reserve low without current evidence. Verify important facts directly. Prefer primary and authoritative sources such as EIA, IEA, DOE, USDA, FAO, World Bank, OPEC, government or maritime notices, plus strong original reporting from Reuters or AP and specialist energy, shipping or defense publications when they provide the underlying reporting."
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            node blog-automation/generate-daily-post.js --dry-run --no-hn
          else
            node blog-automation/generate-daily-post.js --no-hn
          fi

      - name: Import latest Toys for Bots post
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        env:
          SYNDICATION_SOURCE_URL: https://toysforbots.com/syndication/latest.json
          SYNDICATION_REQUIRED: "false"
        run: node blog-automation/syndication/import-toysforbots.js

      - name: Refresh Notavello syndication feed
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: node blog-automation/syndication/export-latest.js

      - name: Generate and validate SEO inventory
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: |
          node .github/scripts/generate-sitemap.js
          node scripts/seo-audit.js --check

      - name: Remove temporary syndication files
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: find pages/blog syndication -type f -name '*.tmp' -delete

      - name: Configure git identity
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name "notavello-blog-bot"
          git config user.email "actions@github.com"

      - name: Commit and push (with retry)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: |
          git add pages/blog syndication/latest.json sitemap.xml reports/seo
          if git diff --cached --quiet; then
            echo "No changes to commit -- nothing was generated or written."
            exit 0
          fi
          git commit -m "Generate and sync blog posts $(date -u +%Y-%m-%d)"

          # Remove dependency changes or temporary files after the final article and feed are committed.
          git reset --hard HEAD
          git clean -fd

          n=0
          until [ $n -ge 5 ]
          do
            git pull --rebase origin main && git push origin main && exit 0
            n=$((n+1))
            echo "Push attempt $n failed, retrying in 5s..."
            sleep 5
          done

          echo "Push failed after 5 attempts."
          exit 1
