name: Generate Daily Blog Post

on:
  schedule:
    # 01:30 UTC daily = 6:30 PM Pacific Daylight Time (roughly Mar-Nov)
    # = 5:30 PM Pacific Standard Time the rest of the year, since GitHub's
    # cron is fixed UTC and does not shift for daylight saving.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Blog topic (blank uses the Iran/energy/food-supply editorial brief)"
        required: false
        type: string
      source_context:
        description: "Optional one-time source/context for this post only"
        required: false
        type: string
      dry_run:
        description: "Dry run only"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: notavello-main-writes
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save --package-lock=false openai

      - name: Generate today's post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_TOPIC: ${{ github.event.inputs.topic || '' }}
          SOURCE_CONTEXT: ${{ github.event.inputs.source_context || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          # Blank scheduled/manual runs no longer use Hacker News as their
          # editorial source. They use Relay's already-curated current signals,
          # then the OpenAI web-search step independently verifies the facts and
          # finds stronger sources before writing.
          if [ -z "$BLOG_TOPIC" ] && [ -z "$SOURCE_CONTEXT" ]; then
            export BLOG_TOPIC="Choose one strong, current, non-duplicate article angle from this editorial field: the Iran war and its real-world consequences; Strait of Hormuz, Red Sea, Suez, tanker, port, refinery, pipeline, LNG and oil-supply disruptions; Brent and WTI price moves; U.S. Strategic Petroleum Reserve and commercial inventory lows; sanctions and OPEC responses; natural-gas, ammonia, urea and fertilizer scarcity; crop-input, food-price and inflation consequences. Prefer a concrete development with a measurable consequence. Do not write a generic war recap, speculative prediction, routine military-hardware story, or claim a shortage unless current evidence supports it. Use Relay only to discover the angle. For facts and links, prefer Reuters or AP for current reporting and primary data from EIA, IEA, World Bank, USDA, FAO, government maritime notices, or other authoritative sources."

            export SOURCE_CONTEXT="$(node -e '
              const fs = require("fs");
              const read = (file) => {
                try { return JSON.parse(fs.readFileSync(file, "utf8")); }
                catch { return {}; }
              };
              const articles = read("pages/relay/article-data.json");
              const pulse = read("pages/relay/pulse-data.json");
              const headlines = (articles.items || []).slice(0, 10).map((item) =>
                `- ${item.title} | ${item.publisher || item.source_id || "Relay"} | ${item.published_at || "date unavailable"} | ${item.url}`
              );
              const energy = (pulse.items || [])
                .filter((item) => ["brent-crude-oil", "natural-gas"].includes(item.id))
                .map((item) =>
                  `- ${item.id}: ${item.formatted_value || "unavailable"}; direction=${item.direction || "unknown"}; observation=${item.observation_date || "unknown"}; source=${item.source || "unknown"}`
                );
              console.log([
                "Current Relay headlines (topic signals only; independently verify every claim):",
                ...headlines,
                "",
                "Current Relay energy indicators (topic signals only; verify against current authoritative data):",
                ...energy
              ].join("\n"));
            ')"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            node blog-automation/generate-daily-post.js --dry-run
          else
            node blog-automation/generate-daily-post.js
          fi

      - name: Import latest Toys for Bots post
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        env:
          SYNDICATION_SOURCE_URL: https://toysforbots.com/syndication/latest.json
          SYNDICATION_REQUIRED: "false"
        run: node blog-automation/syndication/import-toysforbots.js

      - name: Refresh Notavello syndication feed
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: node blog-automation/syndication/export-latest.js

      - name: Generate and validate SEO inventory
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: |
          node .github/scripts/generate-sitemap.js
          node scripts/seo-audit.js --check

      - name: Remove temporary syndication files
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: find pages/blog syndication -type f -name '*.tmp' -delete

      - name: Configure git identity
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name "notavello-blog-bot"
          git config user.email "actions@github.com"

      - name: Commit and push (with retry)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: |
          git add pages/blog syndication/latest.json sitemap.xml reports/seo
          if git diff --cached --quiet; then
            echo "No changes to commit -- nothing was generated or written."
            exit 0
          fi
          git commit -m "Generate and sync blog posts $(date -u +%Y-%m-%d)"

          # Remove dependency changes or temporary files after the final article and feed are committed.
          git reset --hard HEAD
          git clean -fd

          n=0
          until [ $n -ge 5 ]
          do
            git pull --rebase origin main && git push origin main && exit 0
            n=$((n+1))
            echo "Push attempt $n failed, retrying in 5s..."
            sleep 5
          done

          echo "Push failed after 5 attempts."
          exit 1
